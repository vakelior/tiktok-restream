name: Restream m3u8 to RTMP

on:
  schedule:
    # كل ساعة — باش يبقى شغال بحد أقصى (GitHub كيوقف الـ job عند 6 ساعات عالأكثر)
    - cron: '0 * * * *'
  workflow_dispatch:
    # باش تشغلو يدوياً من تبويب Actions

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run restream loop (with auto-restart)
        env:
          M3U8_URL: ${{ secrets.M3U8_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          # حلقة لا نهائية مع auto-restart — كتوقف غير مني يوصل timeout
          while true; do
            echo "▶️  بداية إعادة البث..."
            ffmpeg -hide_banner -loglevel info \
              -re -i "$M3U8_URL" \
              -c copy \
              -f flv "$RTMP_URL"
            echo "⚠️  البث توقف (exit=$?). إعادة بعد 10 ثواني..."
            sleep 10
          done
