name: Restream m3u8 to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          if [ -z "$M3U8_URL" ] || [ -z "$RTMP_URL" ]; then
            echo "ERROR: M3U8_URL or RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK (lengths): M3U8=${#M3U8_URL} RTMP=${#RTMP_URL}"
        env:
          M3U8_URL: ${{ secrets.M3U8_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Run restream loop (no disconnect)
        env:
          M3U8_URL: ${{ secrets.M3U8_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: starting FFmpeg..."
            ffmpeg -hide_banner -loglevel warning \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 10 \
              -rw_timeout 20000000 \
              -stream_loop -1 \
              -re -i "$M3U8_URL" \
              -c copy \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 3s..."
            sleep 3
          done
