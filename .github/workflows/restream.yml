name: Restream m3u8 to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          if [ -z "$RTMP_URL" ]; then
            echo "ERROR: RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK. RTMP length=${#RTMP_URL}"
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Run restream loop (no disconnect)
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          STREAM_URL="https://test-streams.mux.dev/x36xhzz/url_8/193039199_mp4_h264_aac_fhd_7.m3u8"
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: starting FFmpeg (1080p 60fps muxed audio+video)..."
            ffmpeg -hide_banner -loglevel warning \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 10 \
              -rw_timeout 20000000 \
              -stream_loop -1 \
              -re -i "$STREAM_URL" \
              -c copy \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 3s..."
            sleep 3
          done
