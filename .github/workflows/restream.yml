name: Restream video to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          if [ -z "$RTMP_URL" ]; then
            echo "ERROR: RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK. RTMP length=${#RTMP_URL}"
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Download video
        run: |
          curl -L -o video.mp4 "$VIDEO_URL"
          ls -lh video.mp4
        env:
          VIDEO_URL: ${{ secrets.VIDEO_URL }}

      - name: Run restream loop (no disconnect)
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: restreaming video.mp4 to RTMP..."
            ffmpeg -hide_banner -loglevel warning \
              -stream_loop -1 \
              -re -i video.mp4 \
              -c:v copy -c:a aac -b:a 128k \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 3s..."
            sleep 3
          done
