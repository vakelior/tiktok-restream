name: Restream YouTube to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Validate secrets
        run: |
          if [ -z "$RTMP_URL" ]; then
            echo "ERROR: RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK. RTMP length=${#RTMP_URL}"
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Download video
        run: |
          yt-dlp --no-warnings -f "299+140/bestvideo[ext=mp4]+bestaudio[ext=m4a]/best" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "https://youtu.be/tyHkrDqxyXQ"
          ls -lh video.mp4

      - name: Run restream loop (no disconnect)
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: restreaming video.mp4 to RTMP..."
            ffmpeg -hide_banner -loglevel warning \
              -stream_loop -1 \
              -re -i video.mp4 \
              -c:v copy -c:a aac -b:a 128k \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 3s..."
            sleep 3
          done
