name: Restream m3u8 to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          if [ -z "$M3U8_URL" ] || [ -z "$RTMP_URL" ]; then
            echo "ERROR: M3U8_URL or RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK (lengths): M3U8=${#M3U8_URL} RTMP=${#RTMP_URL}"
        env:
          M3U8_URL: ${{ secrets.M3U8_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Run restream loop
        env:
          M3U8_URL: ${{ secrets.M3U8_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          attempts=0
          max_attempts=100
          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: starting FFmpeg..."
            ffmpeg -hide_banner -loglevel warning \
              -re -i "$M3U8_URL" \
              -c copy \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 5s..."
            sleep 5
          done
