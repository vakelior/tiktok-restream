name: Universal Video Restream

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to restream (YouTube or direct MP4 link)'
        required: false
        default: 'https://youtu.be/tyHkrDqxyXQ'
  repository_dispatch:
    types: [restream]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Validate secrets
        run: |
          if [ -z "$RTMP_URL" ]; then
            echo "ERROR: RTMP_URL secret is empty"
            exit 1
          fi
          echo "Secrets OK"
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Resolve video URL
        id: resolve
        run: |
          VIDEO_URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          if [ -z "$VIDEO_URL" ]; then
            VIDEO_URL="https://youtu.be/tyHkrDqxyXQ"
          fi
          echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved URL: $VIDEO_URL"

      - name: Write cookies (if provided)
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > cookies.txt
            echo "cookies.txt written ($(wc -l < cookies.txt) lines)"
          else
            echo "No cookies provided - will use android client (360p)"
          fi
        env:
          COOKIES: ${{ secrets.COOKIES }}

      - name: Download best available, then restream loop
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
          VIDEO_URL: ${{ steps.resolve.outputs.video_url }}
        run: |
          set +e

          echo ">>> Downloading source..."
          if echo "$VIDEO_URL" | grep -qE '\.(mp4|mkv|webm|ts|mov)$'; then
            curl -L -o video.mp4 "$VIDEO_URL"
          elif [ -f cookies.txt ]; then
            echo "Using cookies -> full quality (1080p60)"
            yt-dlp --no-warnings \
              --cookies cookies.txt \
              -f "bv*[ext=mp4][height<=1080]+ba[ext=m4a]/b[ext=mp4]/best" \
              --merge-output-format mp4 \
              -o "video.mp4" \
              "$VIDEO_URL"
          else
            echo "No cookies -> android client (360p fallback)"
            yt-dlp --no-warnings \
              --extractor-args "youtube:player_client=android" \
              -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/18/best" \
              --merge-output-format mp4 \
              -o "video.mp4" \
              "$VIDEO_URL"
          fi

          if [ ! -s video.mp4 ]; then
            echo "ERROR: download failed"
            exit 1
          fi
          ls -lh video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 video.mp4

          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: pushing to RTMP..."
            ffmpeg -hide_banner -loglevel warning \
              -stream_loop -1 \
              -re -i video.mp4 \
              -c:v copy -c:a aac -b:a 128k \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited code=$code. Restarting in 3s..."
            sleep 3
          done
