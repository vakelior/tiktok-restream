name: Restream m3u8 to RTMP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          if [ -z "$RTMP_URL" ]; then
            echo "ERROR: RTMP_URL secret is empty."
            exit 1
          fi
          echo "Secrets OK. RTMP length=${#RTMP_URL}"
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}

      - name: Run restream loop (no disconnect)
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set +e
          VIDEO_URL="https://ireplay.tv/test/rate_5_28.m3u8"
          AUDIO_URL="https://ireplay.tv/test/rate_0_28_live.m3u8"
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            echo ">>> Attempt $attempts: starting FFmpeg..."
            ffmpeg -hide_banner -loglevel warning \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 10 \
              -rw_timeout 20000000 \
              -re -i "$VIDEO_URL" \
              -re -i "$AUDIO_URL" \
              -map 0:v:0 -map 1:a:0 \
              -c:v copy -c:a aac -b:a 128k \
              -f flv "$RTMP_URL"
            code=$?
            echo ">>> FFmpeg exited with code=$code. Restarting in 3s..."
            sleep 3
          done
